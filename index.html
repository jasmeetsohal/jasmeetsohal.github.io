<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" id="meta-description" content="Senior Software Engineer — Node.js, TypeScript, RAG pipelines. Remote for startups and international teams." />
    <meta name="author" content="Jasmeet Singh" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="" id="og-title" />
    <meta property="og:description" content="" id="og-description" />
    <meta property="og:image" content="" id="og-image" />
    <link rel="alternate" hreflang="en" href="?lang=en" />
    <link rel="alternate" hreflang="es" href="?lang=es" />
    <link rel="alternate" hreflang="x-default" href="?lang=en" />
    <title id="doc-title">Jasmeet Singh — Senior Software Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>JS</text></svg>" />
  </head>
  <body>
    <a class="skip-link" href="#main-content" id="skip-link">Skip to content</a>
    <div class="ambient ambient-1" aria-hidden="true"></div>
    <div class="ambient ambient-2" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>
    <div class="noise" aria-hidden="true"></div>
    <div class="open-banner" id="open-banner">
      <span class="open-dot" aria-hidden="true"></span>
      <span id="open-badge-text">Open to opportunities</span>
    </div>

    <header class="site-header">
      <a class="logo" href="#top">
        <span class="logo-mark" aria-hidden="true">JS</span>
        <span id="logo-name">Jasmeet Singh</span>
      </a>
      <nav class="nav" aria-label="Primary" id="main-nav"></nav>
      <div class="header-actions">
        <a class="btn btn-header" href="mailto:jasmeet.singh.tech.dev@gmail.com" id="header-hire-cta">Let's talk</a>
        <div class="lang-switch" role="group" aria-labelledby="lang-label">
          <span class="lang-label" id="lang-label">Language</span>
          <button type="button" class="lang-btn is-active" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
        </div>
        <button class="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main id="main-content">
      <section class="hero" id="top" aria-labelledby="hero-title-block">
        <div class="hero-bg" id="hero-bg" aria-hidden="true"></div>
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-inner">
          <div class="hero-content">
            <div class="profile-header">
              <figure class="hero-avatar">
                <img
                  id="profile-image"
                  src="images/profile.png"
                  alt="Jasmeet Singh"
                  width="280"
                  height="280"
                  loading="eager"
                />
                <span class="avatar-status" id="avatar-status" aria-hidden="true"></span>
              </figure>
              <div class="profile-identity">
                <h1 id="hero-title-block">
                  <span id="hero-title" class="hero-title-main"></span>
                  <span class="hero-title-sub" id="hero-title-em"></span>
                </h1>
                <p class="profile-handle" id="hero-handle">
                  <a href="https://github.com/jasmeetsohal" target="_blank" rel="noopener noreferrer">@jasmeetsohal</a>
                </p>
                <p class="hero-role" id="hero-role"></p>
                <p class="profile-bio eyebrow" id="hero-eyebrow"></p>
              </div>
            </div>
            <p class="lead" id="hero-tagline"></p>
            <div class="hero-meta">
              <span class="pill" id="hero-location"></span>
              <span class="pill pill-accent" id="hero-availability"></span>
            </div>
            <div class="hero-actions">
              <a class="btn btn-primary" href="#contact" id="hero-cta-primary"></a>
              <a class="btn btn-ghost" href="#work" id="hero-cta-secondary"></a>
            </div>
            <p class="hero-resume-line">
              <a href="Jasmeet-Singh-Resume.pdf" id="hero-resume-link" download></a>
            </p>
            <div class="hero-stats" aria-label="Highlights">
              <div class="stat" id="stat-1"></div>
              <div class="stat" id="stat-2"></div>
              <div class="stat" id="stat-3"></div>
              <div class="stat" id="stat-4"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="proof-strip" aria-label="Domains">
        <ul class="proof-list" id="proof-list"></ul>
      </section>

      <!-- UX: Proof of work first — recruiters scan projects before marketing copy -->
      <section class="section reveal" id="work">
        <header class="section-head">
          <span class="section-tag" data-section-tag="work"></span>
          <h2 id="work-heading"></h2>
          <p id="work-subheading"></p>
        </header>
        <div class="projects" id="projects"></div>
      </section>

      <section class="skills-band reveal" aria-labelledby="skills-label">
        <p class="skills-label" id="skills-label"></p>
        <ul class="skills-list" id="skills-list"></ul>
      </section>

      <section class="section reveal" id="why-me">
        <header class="section-head section-head-center">
          <span class="section-tag" data-section-tag="why"></span>
          <h2 id="value-heading"></h2>
          <p id="value-subheading"></p>
        </header>
        <div class="value-grid" id="value-grid"></div>
      </section>

      <section class="section section-panel reveal" id="offers">
        <header class="section-head section-head-center">
          <span class="section-tag" data-section-tag="offers"></span>
          <h2 id="offers-heading"></h2>
          <p id="offers-subheading"></p>
        </header>
        <div class="offers-grid" id="offers-grid"></div>
      </section>

      <section class="section section-panel reveal" id="experience">
        <header class="section-head">
          <span class="section-tag" data-section-tag="experience"></span>
          <h2 id="experience-heading"></h2>
        </header>
        <div class="timeline" id="experience-timeline"></div>
      </section>

      <section class="section reveal" id="about">
        <header class="section-head">
          <span class="section-tag" data-section-tag="about"></span>
          <h2 id="about-heading"></h2>
        </header>
        <div class="about-layout">
          <div class="about-main">
            <p id="about-p1"></p>
            <p id="about-p2"></p>
          </div>
          <aside class="about-card">
            <h3 id="about-lang-heading"></h3>
            <ul id="about-spoken"></ul>
            <h3 id="about-current-heading"></h3>
            <p class="remote-badge" id="about-remote"></p>
            <p class="about-avail" id="about-availability"></p>
            <h3 id="about-edu-heading"></h3>
            <ul id="about-education"></ul>
          </aside>
        </div>
      </section>

      <section class="section section-cta reveal" id="contact">
        <div class="cta-panel">
          <h2 id="contact-heading"></h2>
          <p id="contact-subheading"></p>
          <p class="contact-email-display">
            <a id="contact-email-link" href="mailto:jasmeet.singh.tech.dev@gmail.com">jasmeet.singh.tech.dev@gmail.com</a>
          </p>
          <p class="contact-promise" id="contact-promise"></p>
          <a class="btn btn-primary btn-large" href="#" id="contact-main-cta"></a>
        </div>
        <p class="contact-grid-label" id="contact-grid-label"></p>
        <div class="contact-grid" id="contact-grid"></div>
      </section>
    </main>

    <a class="floating-cta" href="#contact" id="floating-cta"></a>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span id="footer-name">Jasmeet Singh</span> — <span id="footer-text"></span></p>
    </footer>

    <script src="main.js" type="module"></script>
  </body>
</html>
